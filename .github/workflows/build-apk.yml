name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FoneticaInglesa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FoneticaInglesa-apk
          path: FoneticaInglesa.apk

      - name: Publicar en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fonética Inglesa v1.0.${{ github.run_number }}
          body: "Descargá FoneticaInglesa.apk y abrilo en tu Android para instalarlo."
          files: FoneticaInglesa.apk
