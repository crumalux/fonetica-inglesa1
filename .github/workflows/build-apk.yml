name: Compilar APK y AAB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Renombrar APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FoneticaInglesa.apk
          cp app/build/outputs/bundle/release/app-release.aab FoneticaInglesa-sin-firmar.aab

      - uses: actions/upload-artifact@v4
        with:
          name: FoneticaInglesa-apk
          path: |
            FoneticaInglesa.apk
            FoneticaInglesa-sin-firmar.aab

      - name: Publicar en Releases (descarga directa desde el celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fonética Inglesa v1.0.${{ github.run_number }}
          body: "FoneticaInglesa.apk: instalar directo en Android. El .aab es para Play Store (se firma aparte con la clave de subida)."
          files: |
            FoneticaInglesa.apk
            FoneticaInglesa-sin-firmar.aab
